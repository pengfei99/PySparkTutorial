[project]
name = "pysparktutorial"
version = "0.1.0"
description = "In this repo, we will learn how to work with pyspark"
authors = ["pengfei <liu.pengfei@hotmail.fr>"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-status>=1.80.0",
    "notebook>=7.5.5",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "pyspark==4.1.1",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
